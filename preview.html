
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Verification</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #25264a 0%, transparent 45%),
        #0b0c12;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 410px;
    background: #15161f;
    border: 1px solid #292b3b;
    border-radius: 18px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 20px 70px #0008;
}

.logo {
    width: 75px;
    height: 75px;
    border-radius: 22px;
    background: #5865f2;
    display: grid;
    place-items: center;
    margin: 0 auto 23px;
    box-shadow: 0 0 35px #5865f244;
}

.logo svg {
    width: 48px;
    fill: white;
}

h1 {
    font-size: 25px;
    margin-bottom: 10px;
}

.description {
    color: #a5a7ba;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.status {
    background: #1d1f2c;
    border: 1px solid #303246;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 11px;
    text-align: left;
    margin-bottom: 20px;
}

.status-dot {
    width: 10px;
    height: 10px;
    background: #f0b232;
    border-radius: 50%;
    flex-shrink: 0;
}

.status-text {
    font-size: 13px;
    color: #c5c6d3;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #4752c4;
    transform: translateY(-1px);
}

button:disabled {
    opacity: .7;
    cursor: wait;
    transform: none;
}

.spinner {
    display: none;
    width: 17px;
    height: 17px;
    border: 2px solid #ffffff55;
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.demo {
    margin-top: 22px;
    font-size: 11px;
    color: #777b92;
}

.footer {
    margin-top: 13px;
    color: #60647a;
    font-size: 11px;
}

</style>
</head>

<body>

<main class="card">

    <div class="logo">
        <svg viewBox="0 0 127.14 96.36"
             aria-label="Ícone estilizado do Discord">
            <path d="M104.7 8.2A102.8 102.8 0 0 0 79.5.5a70 70 0 0 0-3.2 6.5 95.3 95.3 0 0 0-25.4 0A70 70 0 0 0 47.7.5a102.5 102.5 0 0 0-25.2 7.7C6.5 31.7 2.2 54.7 4.4 77.4A102 102 0 0 0 35.5 93a75 75 0 0 0 6.7-10.8 66 66 0 0 1-10.5-5c.9-.7 1.8-1.4 2.7-2a72.8 72.8 0 0 0 58.3 0c.9.7 1.8 1.4 2.7 2a66 66 0 0 1-10.5 5A75 75 0 0 0 91.6 93a101.6 101.6 0 0 0 31.1-15.6c2.6-26.3-4.4-49.1-18-69.2ZM42.2 65.8c-6.1 0-11.1-5.6-11.1-12.5s4.9-12.5 11.1-12.5 11.2 5.6 11.1 12.5c0 6.9-4.9 12.5-11.1 12.5Zm42.7 0c-6.1 0-11.1-5.6-11.1-12.5s4.9-12.5 11.1-12.5S96 46.4 95.9 53.3c0 6.9-4.9 12.5-11 12.5Z"/>
        </svg>
    </div>

    <h1>Discord Verification</h1>

    <p class="description">
        Clique no botão abaixo para iniciar a verificação
        demonstrativa do sistema.
    </p>

    <div class="status">
        <span class="status-dot" id="dot"></span>
        <div class="status-text" id="status">
            Sistema aguardando verificação
        </div>
    </div>

    <button id="verify" onclick="verify()">
        Verificar Discord
    </button>

    <div class="spinner" id="spinner"></div>

    <p class="demo">
        MODO DEMONSTRAÇÃO · Nenhuma conta será acessada
    </p>

    <p class="footer">
        Página de demonstração independente
    </p>

</main>

<script>
let running = false;

function verify() {
    if (running) return;
    running = true;

    const button = document.getElementById("verify");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot");
    const spinner = document.getElementById("spinner");

    button.disabled = true;
    button.textContent = "Verificando...";
    spinner.style.display = "block";
    dot.style.background = "#f0b232";
    status.textContent = "Executando verificação demonstrativa...";

    setTimeout(() => {
        status.textContent =
            "Demonstração concluída. Nenhuma ação foi realizada.";
        dot.style.background = "#43b581";
        spinner.style.display = "none";
        button.textContent = "Verificar novamente";
        button.disabled = false;
        running = false;
    }, 2500);
}
</script>

</body>
</html>
